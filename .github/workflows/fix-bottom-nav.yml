name: Fix BitFlow Bottom Navigation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply bottom navigation repair
        run: python3 scripts/fix_bottom_nav.py

      - name: Commit repair and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/torrentor/MainActivity.kt scripts/fix_bottom_nav.py .github/workflows/fix-bottom-nav.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: restore BitFlow bottom navigation"
          git rm scripts/fix_bottom_nav.py .github/workflows/fix-bottom-nav.yml
          git commit -m "chore: remove one-time bottom navigation repair"
          git push
