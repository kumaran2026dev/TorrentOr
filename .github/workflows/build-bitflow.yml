name: Build BitFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Repair missing BitFlow bottom navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/torrentor/MainActivity.kt")
          text = path.read_text()

          if "// BITFLOW_BOTTOM_NAV_V1" in text:
              print("Bottom navigation already present.")
          else:
              text = text.replace(
                  'setPadding(dp(16), dp(16), dp(16), dp(20))',
                  'setPadding(dp(16), dp(16), dp(16), dp(92))',
                  1,
              )

              old_add = '''        root.addView(Space(this).apply { layoutParams = LinearLayout.LayoutParams(1, dp(12)) })
          root.addView(button("+  Add download", true) { showAddDownloadDialog() }, LinearLayout.LayoutParams(-1, dp(48)))
'''
              if old_add not in text:
                  raise SystemExit("Expected Add download block was not found; refusing unsafe edit")
              text = text.replace(old_add, "", 1)

              old_set = '''        setContentView(scroll)
          isOnMainScreen = true
'''
              new_set = '''        // BITFLOW_BOTTOM_NAV_V1: fixed navigation stays outside the scrolling content.
          val bottomBar = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = android.view.Gravity.CENTER
              setPadding(dp(8), dp(6), dp(8), dp(6))
              setBackgroundColor(Color.WHITE)
              elevation = dp(5).toFloat()
          }

          fun navItem(label: String, selected: Boolean = false, action: () -> Unit): TextView {
              return TextView(this).apply {
                  text = label
                  textSize = 13f
                  gravity = android.view.Gravity.CENTER
                  setTypeface(typeface, android.graphics.Typeface.BOLD)
                  setTextColor(if (selected) Color.WHITE else fg)
                  background = android.graphics.drawable.GradientDrawable().apply {
                      cornerRadius = dp(10).toFloat()
                      setColor(if (selected) primary else Color.WHITE)
                      if (!selected) setStroke(dp(1), border)
                  }
                  setOnClickListener { action() }
              }
          }

          bottomBar.addView(
              navItem("Downloads", true) { showMainScreen() },
              LinearLayout.LayoutParams(0, dp(52), 1f).apply { rightMargin = dp(6) }
          )
          bottomBar.addView(
              navItem("+ Add", false) { showAddDownloadDialog() },
              LinearLayout.LayoutParams(0, dp(52), 1f).apply { rightMargin = dp(6) }
          )
          bottomBar.addView(
              navItem("Settings", false) { showSettingsScreen() },
              LinearLayout.LayoutParams(0, dp(52), 1f)
          )

          val screen = FrameLayout(this)
          screen.addView(scroll, FrameLayout.LayoutParams(-1, -1))
          screen.addView(
              bottomBar,
              FrameLayout.LayoutParams(-1, dp(64)).apply {
                  gravity = android.view.Gravity.BOTTOM
              }
          )
          setContentView(screen)
          isOnMainScreen = true
'''
              if old_set not in text:
                  raise SystemExit("Expected setContentView block was not found; refusing unsafe edit")
              text = text.replace(old_set, new_set, 1)
              path.write_text(text)
              print("Bottom navigation restored.")
          PY

      - name: Commit bottom navigation repair
        run: |
          if git diff --quiet -- app/src/main/java/com/example/torrentor/MainActivity.kt; then
            echo "No source repair needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/torrentor/MainActivity.kt
            git commit -m "fix: restore BitFlow bottom navigation"
            git push
          fi

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare libtorrent and Boost headers
        run: |
          git clone --depth 1 --branch v2.0.13 https://github.com/arvidn/libtorrent.git "$RUNNER_TEMP/libtorrent"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          echo "LIBTORRENT_INCLUDE_DIR=$RUNNER_TEMP/libtorrent/include" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE_DIR=$RUNNER_TEMP/boost_1_91_0" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/libtorrent/include/libtorrent/session.hpp"
          test -f "$RUNNER_TEMP/boost_1_91_0/boost/asio.hpp"

      - name: Verify Git LFS native libraries
        run: |
          file app/src/main/jniLibs/arm64-v8a/libtorrent-rasterbar.so
          file app/src/main/jniLibs/armeabi-v7a/libtorrent-rasterbar.so
          test -s app/src/main/jniLibs/arm64-v8a/libtorrent-rasterbar.so
          test -s app/src/main/jniLibs/armeabi-v7a/libtorrent-rasterbar.so

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
