name: Refine BitFlow Bottom Navigation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refine-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Refine bottom navigation
        run: python3 scripts/refine_bitflow_bottom_nav.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare libtorrent and Boost headers
        run: |
          git clone --depth 1 --branch v2.0.13 https://github.com/arvidn/libtorrent.git "$RUNNER_TEMP/libtorrent"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          echo "LIBTORRENT_INCLUDE_DIR=$RUNNER_TEMP/libtorrent/include" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE_DIR=$RUNNER_TEMP/boost_1_91_0" >> "$GITHUB_ENV"

      - name: Verify native libraries
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libtorrent-rasterbar.so
          test -s app/src/main/jniLibs/armeabi-v7a/libtorrent-rasterbar.so

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitFlow-bottom-nav-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit refined navigation and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/torrentor/MainActivity.kt
          git rm .github/workflows/refine-bitflow-bottom-nav.yml scripts/refine_bitflow_bottom_nav.py
          git commit -m "fix: make BitFlow bottom navigation Instagram-style"
          git push
