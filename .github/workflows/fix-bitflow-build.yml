name: Fix BitFlow Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Remove duplicate BitFlow UI methods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/torrentor/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          def end_of_function(source: str, start: int) -> int:
              brace_start = source.find('{', start)
              if brace_start < 0:
                  raise SystemExit(f'Opening brace not found for method at {start}')

              depth = 0
              in_string = False
              escaped = False
              in_line_comment = False
              in_block_comment = False
              i = brace_start

              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''

                  if in_line_comment:
                      if c == '\n':
                          in_line_comment = False
                  elif in_block_comment:
                      if c == '*' and n == '/':
                          in_block_comment = False
                          i += 1
                  elif in_string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          in_string = False
                  else:
                      if c == '/' and n == '/':
                          in_line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          in_block_comment = True
                          i += 1
                  
                      elif c == '"':
                          in_string = True
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return i + 1
                  i += 1

              raise SystemExit(f'Closing brace not found for method at {start}')

          def dedupe_method(source: str, signature: str):
              positions = []
              cursor = 0
              while True:
                  start = source.find(signature, cursor)
                  if start < 0:
                      break
                  end = end_of_function(source, start)
                  positions.append((start, end))
                  cursor = end

              if len(positions) == 0:
                  raise SystemExit(f'Expected method not found: {signature}')

              for start, end in reversed(positions[1:]):
                  source = source[:start] + source[end:]

              return source, len(positions)

          signatures = [
              '    private fun showAddDownloadDialog()',
              '    private fun showSettingsScreen()',
              '    private fun showAboutDialog()',
          ]

          counts = {}
          for signature in signatures:
              text, count = dedupe_method(text, signature)
              counts[signature] = count

          path.write_text(text, encoding='utf-8')
          print('Method occurrence counts before cleanup:')
          for signature, count in counts.items():
              print(f'  {signature}: {count}')

          for signature in signatures:
              if text.count(signature) != 1:
                  raise SystemExit(f'Deduplication failed for {signature}: {text.count(signature)} occurrences remain')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare libtorrent and Boost headers
        run: |
          git clone --depth 1 --branch v2.0.13 https://github.com/arvidn/libtorrent.git "$RUNNER_TEMP/libtorrent"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          echo "LIBTORRENT_INCLUDE_DIR=$RUNNER_TEMP/libtorrent/include" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE_DIR=$RUNNER_TEMP/boost_1_91_0" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/libtorrent/include/libtorrent/session.hpp"
          test -f "$RUNNER_TEMP/boost_1_91_0/boost/asio.hpp"

      - name: Verify Git LFS native libraries
        run: |
          file app/src/main/jniLibs/arm64-v8a/libtorrent-rasterbar.so
          file app/src/main/jniLibs/armeabi-v7a/libtorrent-rasterbar.so
          test -s app/src/main/jniLibs/arm64-v8a/libtorrent-rasterbar.so
          test -s app/src/main/jniLibs/armeabi-v7a/libtorrent-rasterbar.so

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK after repair
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Commit verified repair and remove one-time fixer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-bitflow-build.yml
          git add app/src/main/java/com/example/torrentor/MainActivity.kt .github/workflows/fix-bitflow-build.yml
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "fix: remove duplicate BitFlow UI methods"
          git push

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: BitFlow-debug-apk-repaired
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
